version: 2
updates:
  # Action'ы прибиты к SHA — без бота они останутся на нём навсегда,
  # включая тот SHA, в котором позже нашли дыру.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
