name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Схемы mermaid рендерятся в SVG на сборке, для этого нужен chromium.
      # Кешируем по версии playwright, иначе каждый запуск качает ~80 МБ.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - run: npm test
      - run: npm run lint:voice
      - run: npm run check:types
      - run: npm run build
      # Ссылки проверяются по собранному сайту, поэтому только после build.
      - run: npm run check:links
