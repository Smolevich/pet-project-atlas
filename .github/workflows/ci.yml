name: CI
on:
  push:
    branches: [main]
  pull_request:

# Форк-PR не должен получать ни секретов, ни права писать в репозиторий.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Схемы mermaid рендерятся в SVG на сборке, для этого нужен chromium.
      # Кешируем по версии playwright, иначе каждый запуск качает ~80 МБ.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - run: npm test
      - run: npm run lint:voice
      - run: npm run check:types
      - run: npm run build
      # Ссылки проверяются по собранному сайту, поэтому только после build.
      - run: npm run check:links
      # Конфиг уезжает на сервер как есть: синтаксическую ошибку ловим до мержа.
      - name: nginx -t
        run: |
          docker run --rm -v "$PWD/nginx-atlas.conf:/etc/nginx/conf.d/atlas.conf:ro" \
            nginx:stable nginx -t
