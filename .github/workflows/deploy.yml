name: Deploy

on:
  push:
    branches: [main]

  workflow_dispatch:

concurrency:
  group: deploy-atlas
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Сборка и деплой разведены намеренно. `npm ci` выполняет install-скрипты
  # чужих пакетов, и один захваченный пакет в этом же job'е прочитал бы
  # ключ от сервера. Здесь секретов нет вообще, наружу уходит только dist.
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # Схемы mermaid рендерятся в SVG на сборке, для этого нужен chromium.
      # Кешируем по lock-файлу, иначе каждый запуск качает ~80 МБ.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Install chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium

      # This repo takes outside contributions, so a broken build must never
      # reach the box: full preflight before anything touches the server.
      - name: Preflight
        run: |
          npm test
          npm run lint:voice
          npm run build
          npm run check:links

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: |
            dist
            nginx-atlas.conf
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Ship to the origin host
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site

      - name: Connect to the tailnet
        uses: tailscale/github-action@4e4c49acaa9818630ce0bd7a564372c17e33fb4d # v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gha-runner

      - name: Copy files to server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.VDS_HOST }}
          port: ${{ secrets.VDS_PORT }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          passphrase: ${{ secrets.VDS_SSH_PASSPHRASE }}
          source: dist/**,nginx-atlas.conf
          target: /tmp/deploy-atlas
          strip_components: 0

      - name: Install and reload
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VDS_HOST }}
          port: ${{ secrets.VDS_PORT }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          passphrase: ${{ secrets.VDS_SSH_PASSPHRASE }}
          script: |
            set -e
            WEB_DIR=/var/www/atlas
            RELEASE_DIR=/tmp/atlas-release

            rm -rf "$RELEASE_DIR"
            mkdir -p "$RELEASE_DIR"
            cp -a /tmp/deploy-atlas/dist/. "$RELEASE_DIR/"

            sudo rm -rf "$WEB_DIR"
            sudo mkdir -p /var/www
            sudo mv "$RELEASE_DIR" "$WEB_DIR"
            # Root umask on this host sometimes leaves 700 on moved trees —
            # nginx (www-data) can't read that.
            sudo chown -R root:root "$WEB_DIR"
            sudo find "$WEB_DIR" -type d -exec chmod 755 {} +
            sudo find "$WEB_DIR" -type f -exec chmod 644 {} +

            sudo install -m 0644 /tmp/deploy-atlas/nginx-atlas.conf /etc/nginx/sites-available/atlas.conf
            sudo ln -sfn /etc/nginx/sites-available/atlas.conf /etc/nginx/sites-enabled/atlas.conf
            rm -rf /tmp/deploy-atlas

            sudo nginx -t
            sudo systemctl reload nginx
            sleep 1
            curl -fsS -H "Host: atlas.smolevich.com" http://127.0.0.1/ | grep -q "a route out of zero traffic"
