server {
    listen 80;
    listen [::]:80;
    server_name atlas.smolevich.com;

    access_log /var/log/nginx/atlas.access.log;

    # Весь трафик приходит через Cloudflare Tunnel с loopback — восстановить реальный IP.
    # Без этого блока каждый клиент в логе — ::1, а весь смысл публичного сайта
    # в том, чтобы читать собственный access-лог по AI-краулерам.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/atlas;
    index index.html;

    # Starlight: каждая страница — <path>/index.html. Сайт статический
    # multi-page, не SPA — без /index.html-фолбэка, чтобы 404 оставался 404.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    # Хэшированные ассеты Astro — кэшировать надолго.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
